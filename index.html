<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE SYSTEM</title>

<!-- iOS home-screen app. The manifest is what makes push possible at all:
     pre-iOS 26 a web app needs display:standalone declared here, and without
     an installed web app iOS will not expose pushManager to the page. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07090e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="THE SYSTEM">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- atmosphere. every layer pointer-events:none — none of it between a thumb
     and the next checkbox. art/*.jpg are optional; without them the gradients
     carry the screen on their own. -->
<div class="art glow"></div>
<div class="art top"></div>
<div class="art bot"></div>
<div class="art scan"></div>
<div class="art vig"></div>

<div style="height:150px;flex-shrink:0"></div>

<div class="hud pl mono">
  <i class="dot"></i>
  <span class="name">SYSTEM</span>
  <span class="when" id="meta">—</span>
</div>

<section class="hex id pl">
  <div class="emblem cond"><span id="rank">E</span></div>
  <div style="flex:1;min-width:0">
    <div class="wordmark cond">THE SYSTEM</div>
    <div class="meta mono" id="metaline"></div>
    <div class="xp">
      <span class="track"><span class="fill" id="xpbar" style="width:0%"></span></span>
      <span class="num mono" id="xpnum">0/100</span>
    </div>
  </div>
</section>

<!-- one System line at a time. spoken once, tap to dismiss. -->
<div id="line" class="line mono pl" hidden></div>

<!-- shown only after a real absence, and it never scolds -->
<section class="hex pl" id="comeback" hidden>
  <div class="k cond">THE GATE REOPENS</div>
  <h2>—</h2>
  <p></p>
  <button id="cbclose" class="mono">DISMISS</button>
</section>

<!-- THE RECORD, above the list. you see what you built before what you owe. -->
<section class="hex record pl">
  <div class="rowhead">
    <i class="bar"></i>
    <h2 class="cond">THE RECORD</h2>
    <span class="aside mono">18 weeks</span>
  </div>
  <div id="grid"></div>
  <div class="stats mono">
    <div><div class="n lit"><span id="week">0</span><small id="weekof">/7</small></div><div class="k">this week</div></div>
    <div><div class="n" id="cleared">0</div><div class="k">gates</div></div>
    <div><div class="n" id="rate">0%</div><div class="k">30&#8209;day</div></div>
    <div class="push"><div class="n" id="life">0</div><div class="k">logged</div></div>
  </div>
</section>

<!-- the status window. a row per stat with a live habit. -->
<section class="hex pl" id="statsbox" hidden>
  <div class="rowhead">
    <i class="bar"></i>
    <h2 class="cond">STATUS</h2>
    <span class="aside mono">14&#8209;day</span>
  </div>
  <div id="stats" class="mono"></div>
  <div class="statnote mono">how consistently you've shown up lately</div>
</section>

<div class="qhead">
  <h2 class="cond">DAILY QUEST</h2>
  <span class="clock mono" id="clock">—</span>
  <span class="rule"></span>
  <span class="n mono" id="count">0/0</span>
</div>

<div id="list"></div>

<div id="notify" class="mono"></div>

<div class="foot mono">
  <span id="lv">lv 1</span>
</div>

<!-- rank promotion: the biggest visual moment in the app. tap anywhere. -->
<div id="promo" hidden>
  <div class="promo-in">
    <div class="promo-k mono">THE SYSTEM</div>
    <div class="promo-h cond">RANK UP.</div>
    <div class="promo-r cond"><span class="from">E</span><i>&#8594;</i><span class="to">D</span></div>
    <div class="loot mono"></div>
    <div class="promo-tap mono">tap anywhere</div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
