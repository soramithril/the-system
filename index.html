<!doctype html>
<html lang="en" data-store="connecting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE SYSTEM</title>

<!-- iOS home-screen app. The manifest is what makes push possible at all:
     pre-iOS 26 a web app needs display:standalone declared here, and without
     an installed web app iOS will not expose pushManager to the page. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07090e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="THE SYSTEM">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- atmosphere. every layer pointer-events:none — none of it between a thumb
     and the next checkbox. art/*.jpg are optional; without them the gradients
     carry the screen on their own. -->
<div class="art glow"></div>
<div class="art top"></div>
<div class="art bot"></div>
<div class="art scan"></div>
<div class="art vig"></div>

<div class="hud pl mono" id="hud">
  <i class="dot"></i>
  <button type="button" class="name" data-sheet="system">SYSTEM</button>
  <span class="when" id="meta">—</span>
  <i class="hud-scan"></i>
</div>

<section class="hex id pl" id="plate" data-sheet="status">
  <div class="emblem cond" id="emblem"><span id="rank">E</span></div>
  <div style="flex:1;min-width:0">
    <div class="wordmark cond">THE SYSTEM</div>
    <div class="meta mono" id="metaline"></div>
    <div class="xp" id="xpwrap">
      <span class="track"><span class="fill" id="xpbar" style="width:0%"></span></span>
      <span class="num mono" id="xpnum">0/100</span>
    </div>
  </div>
</section>

<!-- shown only after a real absence, and it never scolds -->
<section class="hex pl" id="comeback" hidden>
  <div class="k cond">THE GATE REOPENS</div>
  <h2>—</h2>
  <p></p>
  <button type="button" id="cbclose" class="mono">DISMISS</button>
</section>

<!-- THE FLOW, top to bottom: who you are (the plate) → what today asks
     (DAILY QUEST: required only) → what is extra (BONUS: optional, XP only)
     → this week's quest (WEEKLY) → progress (the Gate, the record, status).
     The required cards must be on screen the moment the app opens. -->
<div class="qhead">
  <h2 class="cond">DAILY QUEST</h2>
  <span class="clock mono" id="clock">—</span>
  <span class="rule"></span>
  <span class="n mono" id="count">0/0</span>
</div>
<div id="list"></div>

<!-- extra: optional quests pay XP and never cost the day -->
<section id="bonus" hidden>
  <div class="qhead">
    <h2 class="cond">BONUS</h2>
    <span class="clock mono">optional &#183; XP only</span>
    <span class="rule"></span>
  </div>
  <div id="bonuslist"></div>
</section>

<section id="weekly" hidden>
  <div class="qhead">
    <h2 class="cond">WEEKLY QUEST</h2>
    <span class="clock mono" id="wkclock"></span>
    <span class="rule"></span>
  </div>
  <div id="wklist"></div>
</section>

<!-- the week's Gate: a boss that dies on the 5th kept day -->
<section class="hex gate pl" id="gate" data-sheet="shadows">
  <div class="boss"><img id="bossimg" alt="" decoding="async"><i class="boss-fx"></i><span class="bossrank cond" id="bossrank">E</span></div>
  <div class="gate-b">
    <div class="rowhead">
      <i class="bar"></i>
      <h2 class="cond" id="gatek">GATE</h2>
      <span class="aside mono" id="gatewhen"></span>
    </div>
    <div class="bossname cond" id="bossname">—</div>
    <div class="hp" id="hp"></div>
    <div class="strip mono" id="strip"></div>
    <div class="gatenote mono" id="gatenote"></div>
  </div>
</section>

<!-- THE RECORD. the 18-week grid of everything kept. -->
<section class="hex record pl">
  <div class="rowhead">
    <i class="bar"></i>
    <h2 class="cond">THE RECORD</h2>
    <span class="aside mono">18 weeks</span>
  </div>
  <div id="grid"></div>
  <div class="stats mono">
    <div><div class="n lit"><span id="week">0</span><small id="weekof">/7</small></div><div class="k">this week</div></div>
    <div><div class="n" id="cleared">0</div><div class="k">gates</div></div>
    <div><div class="n" id="rate">0%</div><div class="k">30&#8209;day</div></div>
    <div class="push"><div class="n" id="life">0</div><div class="k">logged</div></div>
  </div>
</section>

<!-- the status window, as in the source -->
<section class="hex pl" id="statsbox" data-sheet="status">
  <div class="rowhead">
    <i class="bar"></i>
    <h2 class="cond">STATUS</h2>
    <span class="aside mono">bar: 14&#8209;day</span>
  </div>
  <div class="idgrid mono" id="idgrid"></div>
  <div class="nextrank mono" id="nextrank"></div>
  <div id="stats" class="mono"></div>
</section>

<div id="notify" class="mono"></div>

<nav class="foot mono">
  <button type="button" data-sheet="status">STATUS</button>
  <button type="button" data-sheet="shadows">SHADOWS</button>
  <button type="button" data-sheet="inventory">INVENTORY</button>
  <span id="lv">lv 1</span>
</nav>

<!-- System Windows float here, one at a time -->
<div id="windows" aria-live="polite"></div>

<!-- Status / Shadows / Inventory / System: opened on purpose, closed on purpose -->
<div id="sheet" hidden>
  <div class="sheet-in">
    <div class="sheet-h">
      <b class="sw-x mono">!</b>
      <span class="sheet-t cond">STATUS</span>
      <button type="button" class="sheet-x mono" id="sheetx">CLOSE</button>
    </div>
    <div class="sheet-b"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
