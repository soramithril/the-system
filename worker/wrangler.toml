name = "the-system-push"
main = "index.js"
compatibility_date = "2026-09-01"

# hourly; the worker sends only in the hour each subscriber picked, local time
[triggers]
crons = ["0 * * * *"]

# wrangler kv namespace create SUBS  → paste the id it prints
[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
APP_URL = "https://soramithril.github.io/the-system/"
ORIGIN = "https://soramithril.github.io"
# a contact the push services can reach if the worker misbehaves
VAPID_SUBJECT = "mailto:REPLACE_WITH_YOUR_EMAIL"

# secrets (never in this file):
#   wrangler secret put VAPID_PUBLIC
#   wrangler secret put VAPID_PRIVATE
